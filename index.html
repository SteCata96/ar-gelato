<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gelato in AR</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#fdf6ee;font-family:-apple-system,system-ui,sans-serif;color:#2b1d14}
  model-viewer{width:100%;height:100%;--poster-color:transparent}
  h1{position:fixed;top:20px;left:0;right:0;text-align:center;font-size:22px;margin:0;pointer-events:none}
  .btn{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);background:#2b1d14;color:#fff;border:0;
       padding:18px 34px;border-radius:999px;font-size:18px;font-weight:600;white-space:nowrap}
</style>
</head>
<body>
  <model-viewer src="model.glb" ios-src="model.usdz" alt="Cono gelato 3D"
    ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor"
    camera-controls auto-rotate shadow-intensity="1" touch-action="pan-y">
    <button slot="ar-button" class="btn">🍦 Vedi in AR</button>
  </model-viewer>
  <h1>Ruotalo col dito, poi mettilo nella tua stanza</h1>
</body>
</html>
